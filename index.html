<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCM Lite</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
    <h1>HCM Lite</h1>
    <p>Human Capital Management</p>

    <div id="setup-section">
        <h2>First-Time Setup</h2>

        <form id="setup-form">
            <input type="text" id="company-name" placeholder="Company Name" required>
            <input type="text" id="admin-name" placeholder="Admin Name" required>
            <input type="email" id="admin-email" placeholder="Admin Email" required>
            <div class="password-box">
                <input type="password" id="admin-password" placeholder="Create Password" required>   
                <button type="button" class="eye-btn" onclick="togglePassword('admin-password', this)">👁</button>
            </div>

            <button type="submit">Create Admin Account</button>
        </form>
    </div>

    <div id="login-section" class="hidden">
        <h2>Login</h2>

        <form id="login-form">
            <input type="email" id="login-email" placeholder="Email Address" required>
            <div class="password-box">
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="button" class="eye-btn" onclick="togglePassword('login-password', this)">👁</button>
            </div>

            <button type="submit">Login</button>
        </form>
    </div>

    <p id="message"></p>
</div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
